<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mohith Ivaturi, Illustration</title>
    <meta
      name="description"
      content="Illustration work by Mohith Ivaturi — a mix of digital and pencil."
    />
    <link rel="canonical" href="https://mohithivaturi.art/" />

    <!-- Open Graph / social share. Relative image + no absolute og:url so the
         card resolves against whatever host serves the page (dev CDN or prod). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohith Ivaturi" />
    <meta property="og:title" content="Mohith Ivaturi, Illustration" />
    <meta
      property="og:description"
      content="Illustration work by Mohith Ivaturi — a mix of digital and pencil."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Digital painting of Shiva seated in meditation within a glowing mandala"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohith Ivaturi, Illustration" />
    <meta
      name="twitter:description"
      content="Illustration work by Mohith Ivaturi — a mix of digital and pencil."
    />
    <meta name="twitter:image" content="/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
